[package]
name = "gh-commander"
version = "0.1.0"
description = "Better GitHub - a fast, review-focused GitHub client"
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "gh_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
# `raw_value`: request and response bodies pass through as opaque JSON.
serde_json = { version = "1", features = ["raw_value"] }
# rustls + bundled webpki roots: no OpenSSL to cross-compile and no reliance
# on the platform trust store, which rustls cannot read on Android.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
thiserror = "2"
url = "2"

# Desktop only: the window opens where, and as large as, it was closed.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"

# Strict types: no `as` coercions, no panicking shortcuts. Tests may still
# unwrap/expect/panic/index (see clippy.toml).
[lints.clippy]
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
cast_precision_loss = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
