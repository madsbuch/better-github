name: Android

# Every push builds an APK (downloadable as a workflow artifact). Pushes to
# main also publish it to a single, continuously updated "latest" release:
# https://github.com/madsbuch/better-github/releases/download/latest/better-github.apk

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # move the `latest` tag and update its release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Use the runner's Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE is not set. The APK is signed with a throwaway debug key and can't update a previously installed build."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "password=$KEYSTORE_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/upload.jks"
          } > src-tauri/gen/android/keystore.properties

      - name: Build APK
        env:
          # Public OAuth app client id for "Sign in with GitHub" (a repository variable, not a secret).
          GH_COMMANDER_CLIENT_ID: ${{ vars.GH_COMMANDER_CLIENT_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Give every build a higher versionCode than the one before, so each new
          # APK installs as an update: the semver-derived code plus the run number.
          code=$(node -p "const [a, b, c] = require('./src-tauri/tauri.conf.json').version.split('.').map(Number); a * 1e6 + b * 1e3 + c + Number(process.env.RUN_NUMBER)")
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          npm run tauri android build -- --apk --target aarch64 --target armv7 \
            --config "{\"bundle\":{\"android\":{\"versionCode\":$code}}}"

      - name: Collect APK
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then echo "::error::No APK was produced"; exit 1; fi
          mkdir -p out
          cp "$apk" out/better-github.apk
          # Keep existing download links serving the same current build.
          cp "$apk" out/gh-commander.apk
          ls -la out
          grep -h versionCode src-tauri/gen/android/app/tauri.properties || true

      - uses: actions/upload-artifact@v5
        with:
          name: better-github-apk
          path: out/better-github.apk
          if-no-files-found: error

      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          notes="Automated build of \`main\`, updated on every push.

          Commit: $(git rev-parse --short HEAD) $(git log -1 --format=%s)
          Build: #${GITHUB_RUN_NUMBER} (versionCode ${VERSION_CODE})

          On your phone or tablet, download **better-github.apk** below and open it to install or update."
          # A full release marked Latest, so it shows in the repository sidebar and
          # at /releases/latest (GitHub leaves pre-releases out of both).
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --prerelease=false --latest --title "Latest build" --notes "$notes"
          else
            gh release create latest --latest --title "Latest build" --notes "$notes"
          fi
          gh release upload latest out/better-github.apk out/gh-commander.apk --clobber
