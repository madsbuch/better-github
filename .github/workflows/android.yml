name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the APK to releases on tags
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Use the runner's Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No signing secrets configured; the APK is signed with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "password=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > src-tauri/gen/android/keystore.properties

      - name: Build APK
        env:
          # Public OAuth app client id for "Sign in with GitHub" (a repository variable, not a secret).
          GH_COMMANDER_CLIENT_ID: ${{ vars.GH_COMMANDER_CLIENT_ID }}
        run: npm run tauri android build -- --apk --target aarch64 --target armv7

      - name: Collect APK
        run: |
          mkdir -p out
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out
          version=$(node -p "require('./package.json').version")
          for f in out/*.apk; do mv "$f" "out/gh-commander-${version}-$(basename "$f" | sed 's/^app-//')"; done
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: gh-commander-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
