name: macOS

# Every push builds a disk image of the desktop app for Apple silicon Macs
# (downloadable as a workflow artifact). Pushes to main also publish it to the
# continuously updated "latest" release, next to the Android APK:
# https://github.com/madsbuch/better-github/releases/download/latest/better-github-macos-arm64.dmg

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Build DMG (Apple silicon)
    # macos-latest runs on Apple silicon, so this is a native build.
    runs-on: macos-latest
    permissions:
      contents: write # update the `latest` release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Choose how to sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            # A Developer ID certificate: Tauri signs with it, and notarizes
            # when the Apple ID is there too. Empty values must not be passed
            # on, Tauri would try to use them.
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              value="${!name}"
              if [ -n "$value" ]; then
                {
                  echo "$name<<__END__"
                  echo "$value"
                  echo "__END__"
                } >> "$GITHUB_ENV"
              fi
            done
            echo 'SIGNING_CONFIG={}' >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_CERTIFICATE is not set. The app is signed ad hoc and not notarized: macOS asks for confirmation in System Settings > Privacy & Security the first time it is opened."
            # Apple silicon refuses to run unsigned code; an ad-hoc signature ("-") is enough to run.
            echo 'SIGNING_CONFIG={"bundle":{"macOS":{"signingIdentity":"-"}}}' >> "$GITHUB_ENV"
          fi

      - name: Build DMG
        env:
          # Public OAuth app client id for "Sign in with GitHub" (a repository variable, not a secret).
          GH_COMMANDER_CLIENT_ID: ${{ vars.GH_COMMANDER_CLIENT_ID }}
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg --config "$SIGNING_CONFIG"

      - name: Collect DMG
        run: |
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n 1)
          if [ -z "$dmg" ]; then echo "::error::No DMG was produced"; exit 1; fi
          mkdir -p out
          cp "$dmg" out/better-github-macos-arm64.dmg
          ls -la out
          # What it was signed with, and for which architecture.
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          codesign --display --verbose=2 "$app" 2>&1 | grep -E 'Signature|Authority|Identifier' || true
          lipo -archs "$app"/Contents/MacOS/* || true

      - uses: actions/upload-artifact@v5
        with:
          name: better-github-macos-arm64
          path: out/better-github-macos-arm64.dmg
          if-no-files-found: error

      - name: Publish DMG to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Android workflow moves the `latest` tag and writes the release
          # notes; this only adds the disk image. Whichever finishes first
          # creates the release.
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --latest --target "$GITHUB_SHA" --title "Latest build" --notes "Automated build of \`main\`."
          fi
          gh release upload latest out/better-github-macos-arm64.dmg --clobber
